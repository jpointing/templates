name: Secret scan (full history)

# Monthly gitleaks scan of the whole repository history (templates repo).
# The pre-push gate scans only the commits each push adds; this catches anything
# that got past it, such as a push made without the hook.
#
# Copy to .github/workflows/secret-scan-full.yml. Uses the repo's .gitleaks.toml
# if it has one. Cost: one short job a month (about a minute of Actions time).

on:
  schedule:
    - cron: "17 4 1 * *" # 04:17 UTC on the 1st of each month
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-full
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks (full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          set -euo pipefail
          VER=8.30.1
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
      - name: Scan full history (findings redacted)
        run: gitleaks git --redact --no-banner --log-opts="--all" .
