name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          VER=8.21.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Hook template tests
        run: sh githooks/test-hooks.sh

      - name: Gitleaks
        run: gitleaks detect --source . --verbose --redact

      - name: Forbidden terms
        env:
          FORBIDDEN_TERMS: ${{ secrets.FORBIDDEN_TERMS }}
        run: |
          set -euo pipefail
          if [ -z "${FORBIDDEN_TERMS}" ]; then
            echo "::warning::FORBIDDEN_TERMS secret is empty; skipping forbidden-terms check"
            exit 0
          fi
          printf '%s\n' "${FORBIDDEN_TERMS}" > /tmp/forbidden.txt
          # Drop blank lines
          sed -i '/^[[:space:]]*$/d' /tmp/forbidden.txt
          if [ ! -s /tmp/forbidden.txt ]; then
            echo "::warning::FORBIDDEN_TERMS secret is empty; skipping forbidden-terms check"
            exit 0
          fi
          if grep -RniI -F -f /tmp/forbidden.txt --exclude-dir=.git .; then
            echo "::error::Forbidden personal terms found in the repo"
            exit 1
          fi
          echo "No forbidden terms found"
